name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 解压项目文件（如果上传的是 zip）
        run: |
          if [ -f TodayApp.zip ]; then
            unzip -o TodayApp.zip
          fi

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Today-app
          path: app/build/outputs/apk/release/app-release.apk
